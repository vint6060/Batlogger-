<body>

<div class="container">
    <h1>🔋 Battery Tracker Pro</h1>
    <div class="subtitle">Скажите: "Второй аккумулятор сегодня 85 процентов"</div>

    <div class="input-group">
        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()">
            🎤 Нажмите и скажите
        </button>
        <div class="status-text" id="voiceStatus"></div>

        <div class="row">
            <select id="batterySelect">
                <option value="1">АКБ №1</option>
                <option value="2">АКБ №2</option>
                <option value="3">АКБ №3</option>
                <option value="4">АКБ №4</option>
            </select>
        </div>

        <div class="row">
            <input type="date" id="dateInput">
            <input type="number" id="chargeInput" placeholder="%" min="0" max="100">
        </div>

        <button class="btn-add" onclick="manualAddEntry()">
            ➕ Добавить вручную
        </button>
        
        <div class="actions-row">
            <button class="btn-export" onclick="exportCSV()">📥 Скачать Excel (CSV)</button>
            <button class="btn-clear" onclick="clearAll()">Очистить всё</button>
        </div>    </div>

    <div class="list-container">
        <div class="list-header">
            <span>История</span>
            <span>Записей: <span id="totalCount">0</span></span>
        </div>
        <div id="listBody"></div>
    </div>
</div>

<div id="toast" class="toast">✅ Запись добавлена автоматически</div>

<script>
    // Инициализация
    document.getElementById('dateInput').valueAsDate = new Date();
    let entries = JSON.parse(localStorage.getItem('batteryEntriesPro')) || [];
    
    // Словари для распознавания речи
    const months = {
        'января': 0, 'февраля': 1, 'марта': 2, 'апреля': 3, 'мая': 4, 'июня': 5,
        'июля': 6, 'августа': 7, 'сентября': 8, 'октября': 9, 'ноября': 10, 'декабря': 11
    };
    
    const batteryAliases = {
        'первый': 1, 'первую': 1, 'один': 1, 'единицу': 1,
        'второй': 2, 'вторую': 2, 'два': 2, 'двойку': 2,
        'третий': 3, 'тройку': 3, 'три': 3,
        'четвертый': 4, 'четверку': 4, 'четыре': 4
    };

    function render() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        
        // Сортировка: Сначала новые
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        document.getElementById('totalCount').innerText = entries.length;

        // Подсчет циклов
        let cycleCounters = {};
        entries.forEach(e => {
            cycleCounters[e.battery] = (cycleCounters[e.battery] || 0) + 1;
        });

        entries.forEach((entry) => {
            const currentCycle = cycleCounters[entry.battery];
            cycleCounters[entry.battery]--; 
            const div = document.createElement('div');
            div.className = 'list-item';
            
            const dateObj = new Date(entry.date);
            const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            div.innerHTML = `
                <div class="item-info">
                    <div class="item-date">${dateStr}</div>
                    <div class="item-meta">
                        <span class="badge-batt">АКБ ${entry.battery}</span>
                        <span class="badge-cycle">Цикл: ${currentCycle}</span>
                    </div>
                </div>
                <div class="item-charge">${entry.charge}%</div>
                <button class="btn-delete" onclick="deleteEntry(${entry.id})">✕</button>
            `;
            listBody.appendChild(div);
        });
    }

    function saveData() {
        localStorage.setItem('batteryEntriesPro', JSON.stringify(entries));
        render();
    }

    function addEntryLogic(dateVal, chargeVal, battVal) {
        if (!dateVal || !chargeVal) return false;

        const newEntry = {
            id: Date.now(),
            date: dateVal,
            charge: parseInt(chargeVal),
            battery: battVal || document.getElementById('batterySelect').value
        };

        entries.push(newEntry);
        saveData();
        return true;
    }

    function manualAddEntry() {
        const date = document.getElementById('dateInput').value;
        const charge = document.getElementById('chargeInput').value;
        const battery = document.getElementById('batterySelect').value;

        if(addEntryLogic(date, charge, battery)) {
            document.getElementById('chargeInput').value = '';
            showToast("Запись добавлена");
        } else {            alert('Заполните дату и процент заряда');
        }
    }

    function deleteEntry(id) {
        if(confirm('Удалить эту запись?')) {
            entries = entries.filter(e => e.id !== id);
            saveData();
        }
    }

    function clearAll() {
        if(confirm('Удалить ВСЮ историю безвозвратно?')) {
            entries = [];
            saveData();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // --- ЭКСПОРТ В CSV ---
    function exportCSV() {
        if (entries.length === 0) {
            alert('Нет данных для экспорта');
            return;
        }

        // BOM для корректного отображения кириллицы в Excel
        let csvContent = "\uFEFF"; 
        csvContent += "Дата;Номер АКБ;Заряд %;ID записи\n";

        entries.forEach(e => {
            // Преобразуем дату в удобный формат ДД.ММ.ГГГГ
            const d = new Date(e.date);
            const dateFormatted = d.toLocaleDateString('ru-RU');
            
            csvContent += `${dateFormatted};${e.battery};${e.charge};${e.id}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `battery_log_${new Date().toISOString().slice(0,10)}.csv`);        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- ГОЛОСОВОЙ ВВОД ---

    let recognition;
    let isListening = false;

    function initSpeech() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Голосовой ввод не поддерживается. Используйте Chrome или Safari.');
            return null;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'ru-RU';
        rec.interimResults = false;
        return rec;
    }

    function toggleVoice() {
        if (!recognition) recognition = initSpeech();
        if (!recognition) return;

        const btn = document.getElementById('voiceBtn');
        const status = document.getElementById('voiceStatus');

        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }

        recognition.onstart = () => {
            isListening = true;
            btn.classList.add('listening');
            btn.innerText = "🛑 Стоп (слушаю...)";
            status.innerText = "Слушаю...";
        };

        recognition.onend = () => {
            isListening = false;
            btn.classList.remove('listening');
            btn.innerText = "🎤 Нажмите и скажите";
        };
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript.toLowerCase();
            status.innerText = `"${text}"`;
            processVoiceCommand(text);
        };
    }

    function processVoiceCommand(text) {
        let foundBattery = null;
        let foundDate = null;
        let foundCharge = null;

        // 1. Поиск АКБ
        for (let word in batteryAliases) {
            if (text.includes(word)) {
                foundBattery = batteryAliases[word];
                break;
            }
        }
        // Проверка на "номер X"
        const battNumMatch = text.match(/(?:акб|номер|батарея)\s*(\d)/i);
        if (battNumMatch) foundBattery = parseInt(battNumMatch[1]);

        // Если нашли АКБ голосом, обновляем селектор
        if (foundBattery) {
            document.getElementById('batterySelect').value = foundBattery;
        } else {
            // Если не сказали номер, берем текущий из селектора
            foundBattery = document.getElementById('batterySelect').value;
        }

        // 2. Поиск Даты
        if (text.includes('сегодня')) {
            foundDate = new Date().toISOString().split('T')[0];
        } else if (text.includes('вчера')) {
            const d = new Date(); d.setDate(d.getDate() - 1);
            foundDate = d.toISOString().split('T')[0];
        } else {
            const dateRegex = /(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/;
            const dateMatch = text.match(dateRegex);
            if (dateMatch) {
                const day = parseInt(dateMatch[1]);
                const month = months[dateMatch[2]];
                const year = new Date().getFullYear();
                const d = new Date(year, month, day);
                foundDate = d.toISOString().split('T')[0];
            }
        }

        if (foundDate) {            document.getElementById('dateInput').value = foundDate;
        } else {
            foundDate = document.getElementById('dateInput').value; // Берем из поля, если не сказали
        }

        // 3. Поиск Процентов
        // Ищем числа. Стараемся игнорировать номер АКБ, если он был назван числом.
        const numbers = text.match(/\d+/g);
        if (numbers) {
            for (let numStr of numbers) {
                const num = parseInt(numStr);
                // Логика: если число <= 100 и оно НЕ совпадает с номером АКБ (на всякий случай), то это заряд
                if (num >= 0 && num <= 100) {
                    // Доп. проверка: если мы нашли АКБ по слову "два", а число тоже 2, это может быть конфликт.
                    // Но обычно говорят "Второй ... 80 процентов".
                    // Просто берем последнее подходящее число <= 100
                    foundCharge = num;
                }
            }
        }

        if (foundCharge) {
            document.getElementById('chargeInput').value = foundCharge;
        }

        // АВТОСОХРАНЕНИЕ
        if (foundDate && foundCharge) {
            // Задержка перед сохранением, чтобы пользователь увидел результат распознавания
            setTimeout(() => {
                addEntryLogic(foundDate, foundCharge, foundBattery);
                showToast(`✅ Сохранено: АКБ ${foundBattery}, ${foundCharge}%`);
                
                // Очистка поля заряда для следующего ввода
                document.getElementById('chargeInput').value = '';
            }, 1500);
        } else {
            showToast("⚠️ Не распознан заряд или дата");
        }
    }

    render();
</script>
