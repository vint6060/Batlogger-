<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battery Tracker Pro</title>
    <meta name="theme-color" content="#050505">
    
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #020204;       
            --card-bg: rgba(10, 15, 30, 0.65); 
            --text-main: #e2e8f0;     
            --text-sec: #94a3b8;      
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;  
            --danger: #ef4444;        
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        /* === CANVAS BACKGROUND === */
        #battery-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; 
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 40%, #000000 100%);
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto;
            position: relative;
            z-index: 1; 
            opacity: 0;
            animation: fadeInContent 0.6s ease-out 2.3s forwards;
        }

        @keyframes fadeInContent {
            to { opacity: 1; }
        }

        h1 { 
            font-size: 24px; 
            font-weight: 800; 
            margin: 0 0 5px 0; 
            text-align: center; 
            letter-spacing: -0.5px;
            color: white;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }
        .subtitle { 
            text-align: center; 
            color: var(--text-sec); 
            font-size: 14px; 
            margin-bottom: 25px; 
        }

        /* Карточка ввода - Glassmorphism */
        .input-group {
            background: var(--card-bg);
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-purple);
            border: var(--glass-border);
        }

        /* Кнопка микрофона */
        .btn-voice { 
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white; 
            border: none;
            padding: 14px;
            border-radius: 12px;            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        
        .btn-voice:active { transform: scale(0.98); }
        
        .listening { 
            animation: pulse-red 1.5s infinite; 
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-text { 
            text-align: center; 
            font-size: 13px; 
            height: 20px; 
            margin-bottom: 15px; 
            color: var(--text-sec); 
            font-style: italic;
        }

        /* Селектор батарей */
        .battery-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .batt-checkbox { display: none; }

        .batt-label {
            padding: 10px 5px;            background: rgba(15, 23, 42, 0.4);
            border: 1px solid #334155;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            color: var(--text-sec);
            user-select: none;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .batt-checkbox:checked + .batt-label {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            color: #ddd6fe;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .batt-label::before {
            content: "🔋";
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        /* Поля ввода */
        .row { display: flex; gap: 12px; margin-bottom: 20px; }
        
        input[type="date"], input[type="number"] {
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 16px;
            width: 100%;
            outline: none;
            background: rgba(2, 6, 23, 0.6);
            color: var(--text-main);
            font-family: inherit;
            transition: border-color 0.2s;
            backdrop-filter: blur(5px);
        }
        
        input:focus { border-color: #8b5cf6; background: rgba(2, 6, 23, 0.9); }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        /* Основные кнопки действий */
        button.btn-add { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        
        .actions-row { display: flex; gap: 10px; }
        
        .btn-secondary {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            background: rgba(15, 23, 42, 0.4);
            color: var(--text-main);
            backdrop-filter: blur(5px);
        }
        
        .btn-export:hover { background: rgba(30, 41, 59, 0.8); }
        .btn-clear { background: rgba(127, 29, 29, 0.4); color: #fecaca; }
        .btn-clear:hover { background: rgba(153, 27, 27, 0.6); }

        /* Список истории */
        .list-container { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            border-radius: var(--radius); 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            border: var(--glass-border);
            border-left: 3px solid var(--accent-purple);
        }
        
        .list-header { 
            padding: 15px 20px; 
            background: rgba(2, 6, 23, 0.8);             border-bottom: 1px solid #1e293b; 
            font-weight: 700; 
            font-size: 14px;
            color: var(--text-sec); 
            display: flex; 
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .list-item {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes slideInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .list-item:last-child { border-bottom: none; }
        .item-info { flex: 1; }
        .item-date { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .item-meta { margin-top: 4px; display: flex; gap: 8px; align-items: center; }
        
        .badge { 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
        }
        .badge-batt { 
            background: rgba(139, 92, 246, 0.2); 
            color: #c4b5fd; 
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .badge-cycle { 
            background: rgba(6, 182, 212, 0.2); 
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        
        .item-charge { 
            font-weight: 800;             color: #34d399; 
            font-size: 20px; 
            min-width: 60px; 
            text-align: right; 
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        .btn-delete { 
            background: transparent;
            color: #475569;
            border: none;
            font-size: 18px;
            padding: 5px;
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        .btn-delete:hover { color: var(--danger); }

        /* Toast уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .toast.show { 
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0); 
        }

        /* === SPLASH SCREEN: Эффект проваливания === */
        .splash-screen {            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #1e1b4b 0%, #0f172a 40%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: contentFloat 3s ease-in-out infinite;
        }

        @keyframes contentFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Батарея-портал */
        .battery-portal {
            position: relative;
            width: 120px;
            height: 200px;
            margin: 0 auto 30px;
            cursor: default;
        }

        .battery-outline {
            position: absolute;
            width: 100%;
            height: 90%;
            bottom: 0;
            border: 4px solid var(--accent-purple);
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: 
                0 0 30px rgba(139, 92, 246, 0.6),
                inset 0 0 20px rgba(139, 92, 246, 0.2);            animation: pulse-border 2s ease-in-out infinite;
        }

        .battery-outline::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: var(--accent-purple);
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.8);
        }

        .battery-fill {
            position: absolute;
            width: calc(100% - 16px);
            height: 0%;
            bottom: 8px;
            left: 8px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 8px;
            animation: fillBattery 1.5s ease-out forwards;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
        }

        @keyframes fillBattery { to { height: 85%; } }

        @keyframes pulse-border {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(139, 92, 246, 0.6),
                    inset 0 0 20px rgba(139, 92, 246, 0.2);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(139, 92, 246, 0.9),
                    inset 0 0 30px rgba(139, 92, 246, 0.4);
            }
        }

        .battery-glow {
            position: absolute;
            width: 100%;
            height: 90%;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            border-radius: 12px;            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .portal-particles {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 300px;
            pointer-events: none;
        }

        .portal-particle {
            position: absolute;
            width: 4px; height: 4px;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0;
            animation: particleFall 1.2s ease-out forwards;
        }

        @keyframes particleFall {
            0% { opacity: 1; transform: translateY(-50px) scale(1); }
            50% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(250px) scale(0.3); }
        }

        .splash-text {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .splash-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.7);
            letter-spacing: 1px;
        }

        .splash-subtitle {
            font-size: 13px;
            color: var(--text-sec);
        }
        .splash-subtitle::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0%, 25% { content: ''; }
            50% { content: '.'; }
            75% { content: '..'; }
            100% { content: '...'; }
        }

        .fall-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(2, 2, 4, 0.9) 80%, #000 100%);
            opacity: 0;
            animation: fallZoom 0.8s 1.5s ease-in forwards;
            pointer-events: none;
        }

        @keyframes fallZoom {
            0% { opacity: 0; transform: scale(1); }
            100% { opacity: 1; transform: scale(3); }
        }

        .splash-screen.falling .splash-content {
            animation: fallThroughContent 0.8s 1.5s ease-in forwards !important;
        }

        @keyframes fallThroughContent {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(100vh) scale(0.3); }
        }

        @media (max-width: 400px) {
            .battery-portal { width: 100px; height: 170px; }
            .splash-title { font-size: 18px; }
        }

        /* Отключение анимаций для пользователей с prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .splash-screen { transition: none !important; }        }
    </style>
</head>
<body>

<!-- SplashScreen: Эффект проваливания -->
<div id="splash-screen" class="splash-screen">
    <div class="splash-content">
        <div class="battery-portal">
            <div class="battery-outline"></div>
            <div class="battery-fill"></div>
            <div class="battery-glow"></div>
            <div class="portal-particles" id="portalParticles"></div>
        </div>
        <div class="splash-text">
            <span class="splash-title">Battery Tracker</span>
            <span class="splash-subtitle">Загрузка</span>
        </div>
    </div>
    <div class="fall-overlay"></div>
</div>

<!-- Канвас для анимации фона -->
<canvas id="battery-canvas"></canvas>

<div class="container">
    <h1>🔋 Battery Tracker</h1>
    <div class="subtitle">Учёт заряда аккумуляторов</div>

    <div class="input-group">
        <!-- Голосовой ввод -->
        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()">
            <span id="micIcon">🎤</span> <span id="micText">Нажать и сказать</span>
        </button>
        <div class="status-text" id="voiceStatus"></div>

        <!-- Выбор АКБ -->
        <div class="battery-selector">
            <input type="checkbox" id="chk1" class="batt-checkbox" value="1" checked>
            <label for="chk1" class="batt-label">АКБ 1</label>
            <input type="checkbox" id="chk2" class="batt-checkbox" value="2">
            <label for="chk2" class="batt-label">АКБ 2</label>
            <input type="checkbox" id="chk3" class="batt-checkbox" value="3">
            <label for="chk3" class="batt-label">АКБ 3</label>
            <input type="checkbox" id="chk4" class="batt-checkbox" value="4">
            <label for="chk4" class="batt-label">АКБ 4</label>
        </div>

        <!-- Поля даты и заряда -->
        <div class="row">            <input type="date" id="dateInput">
            <input type="number" id="chargeInput" placeholder="Заряд %" min="0" max="100">
        </div>

        <button class="btn-add" onclick="manualAddEntry()">Добавить запись</button>
        
        <div class="actions-row">
            <button class="btn-secondary btn-export" onclick="exportCSV()">📥 CSV</button>
            <button class="btn-secondary btn-clear" onclick="clearAll()">Очистить всё</button>
        </div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>История</span>
            <span>Всего: <span id="totalCount">0</span></span>
        </div>
        <div id="listBody"></div>
    </div>
</div>

<div id="toast" class="toast">✅ Успешно добавлено</div>

<script>
    // ============================================
    // 🌌 CANVAS: Космический фон (Milky Way)
    // ============================================
    const canvas = document.getElementById('battery-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    
    const config = {
        particleCount: 200,
        rotationSpeed: 0.002,
        trailOpacity: 0.1
    };

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() { this.reset(true); }
        reset(initial = false) {
            this.radius = Math.random() * (Math.max(width, height) / 1.5);
            this.angle = Math.random() * Math.PI * 2;
            this.speed = (config.rotationSpeed * (1000 / (this.radius + 100))) * (0.8 + Math.random() * 0.4);            const centerFactor = 1 - (this.radius / (Math.max(width, height) / 1.5));
            this.size = Math.random() * (1 + centerFactor * 2);
            if (centerFactor > 0.7) {
                this.color = `rgba(255, 255, 255, ${0.5 + Math.random() * 0.5})`;
            } else if (centerFactor > 0.3) {
                this.color = `rgba(139, 92, 246, ${0.4 + Math.random() * 0.4})`;
            } else {
                this.color = `rgba(6, 182, 212, ${0.2 + Math.random() * 0.3})`;
            }
        }
        update() { this.angle += this.speed; }
        draw() {
            const centerX = width / 2, centerY = height / 2;
            const x = centerX + Math.cos(this.angle) * this.radius;
            const y = centerY + Math.sin(this.angle) * this.radius;
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            if (this.size > 1.5) { ctx.shadowBlur = 10; ctx.shadowColor = this.color; }
            else { ctx.shadowBlur = 0; }
            ctx.fill();
        }
    }

    for(let i = 0; i < config.particleCount; i++) particles.push(new Star());

    function animate() {
        ctx.fillStyle = `rgba(2, 2, 4, ${config.trailOpacity})`;
        ctx.fillRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();


    // ============================================
    // 📱 ЛОГИКА ПРИЛОЖЕНИЯ
    // ============================================
    
    let entries = [];
    const months = {
        'января': 0, 'февраля': 1, 'марта': 2, 'апреля': 3, 'мая': 4, 'июня': 5,
        'июля': 6, 'августа': 7, 'сентября': 8, 'октября': 9, 'ноября': 10, 'декабря': 11
    };
    
    const batteryAliases = {
        'первый': 1, 'первую': 1, 'один': 1, 'единицу': 1, 'первое': 1,
        'второй': 2, 'вторую': 2, 'два': 2, 'двойку': 2, 'второе': 2,
        'третий': 3, 'тройку': 3, 'три': 3, 'третье': 3,
        'четвертый': 4, 'четверку': 4, 'четыре': 4, 'четвёртую': 4    };

    // === Toast уведомления ===
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.borderColor = type === 'error' ? 'rgba(239, 68, 68, 0.3)' : 'rgba(139, 92, 246, 0.3)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // === Рендер списка ===
    function render() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById('totalCount').innerText = entries.length;
        
        let cycleCounters = {};
        entries.forEach(e => {
            const battKey = String(e.battery);
            cycleCounters[battKey] = (cycleCounters[battKey] || 0) + 1;
        });

        entries.forEach((entry, index) => {
            const battKey = String(entry.battery);
            const currentCycle = cycleCounters[battKey];
            cycleCounters[battKey]--; 

            const div = document.createElement('div');
            div.className = 'list-item';
            div.style.animationDelay = `${index * 0.05}s`; 
            
            const dateObj = new Date(entry.date);
            const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            div.innerHTML = `
                <div class="item-info">
                    <div class="item-date">${dateStr}</div>
                    <div class="item-meta">
                        <span class="badge badge-batt">АКБ ${entry.battery}</span>
                        <span class="badge badge-cycle">Цикл ${currentCycle}</span>
                    </div>
                </div>
                <div class="item-charge">${entry.charge}%</div>
                <button class="btn-delete" onclick="deleteEntry(${entry.id})">✕</button>
            `;
            listBody.appendChild(div);
        });
    }
    // === Сохранение в localStorage ===
    function saveData() {
        localStorage.setItem('batteryEntriesPro', JSON.stringify(entries));
        render();
    }

    // === Получить выбранные батареи ===
    function getSelectedBatteries() {
        const checkboxes = document.querySelectorAll('.batt-checkbox:checked');
        return Array.from(checkboxes).map(cb => cb.value);
    }

    // === Ручное добавление записи ===
    function manualAddEntry() {
        const date = document.getElementById('dateInput').value;
        const chargeVal = document.getElementById('chargeInput').value;
        const selectedBatts = getSelectedBatteries();

        if (!date || !chargeVal) { showToast('⚠️ Укажите дату и заряд'); return; }
        if (selectedBatts.length === 0) { showToast('⚠️ Выберите аккумулятор'); return; }
        
        const charge = parseInt(chargeVal);
        if (isNaN(charge) || charge < 0 || charge > 100) { 
            showToast('⚠️ Заряд должен быть 0-100%'); 
            return; 
        }

        selectedBatts.forEach(batt => {
            entries.push({
                id: Date.now() + Math.random(), 
                date: date, 
                battery: parseInt(batt), 
                charge: charge
            });
        });

        saveData();
        showToast('✅ Добавлено: ' + selectedBatts.length + ' АКБ');
        document.getElementById('chargeInput').value = '';
    }

    // === Удаление записи ===
    function deleteEntry(id) {
        if(confirm('Удалить эту запись?')) {
            entries = entries.filter(e => e.id !== id);
            saveData();
            showToast('🗑️ Удалено');
        }
    }
    // === Очистка всех данных ===
    function clearAll() {
        if(entries.length === 0) { showToast('📭 Нет данных для очистки'); return; }
        if(confirm('⚠️ Удалить ВСЕ записи? Это действие нельзя отменить.')) {
            entries = [];
            saveData();
            showToast('🧹 Все данные очищены');
        }
    }

    // === Экспорт в CSV ===
    function exportCSV() {
        if(entries.length === 0) { showToast('📭 Нет данных для экспорта'); return; }
        
        let csv = 'Дата;АКБ;Заряд(%)\n';
        entries.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(e => {
            csv += `${e.date};${e.battery};${e.charge}\n`;
        });
        
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `battery_export_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('📥 CSV экспортирован');
    }

    // === Голосовой ввод ===
    let recognition;
    let isListening = false;

    function toggleVoice() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showToast('🎤 Голосовой ввод не поддерживается');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!recognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase().trim();                parseVoiceCommand(transcript);
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                stopListening();
                if(event.error === 'no-speech') showToast('🎤 Не удалось распознать речь');
                else if(event.error === 'audio-capture') showToast('🎤 Нет доступа к микрофону');
            };

            recognition.onend = () => { if(isListening) stopListening(); };
        }

        if (isListening) {
            recognition.stop();
            stopListening();
        } else {
            startListening();
            recognition.start();
        }
    }

    function startListening() {
        isListening = true;
        const btn = document.getElementById('voiceBtn');
        const icon = document.getElementById('micIcon');
        const text = document.getElementById('micText');
        const status = document.getElementById('voiceStatus');
        
        btn.classList.add('listening');
        icon.textContent = '🔴';
        text.textContent = 'Слушаю...';
        status.textContent = 'Говорите: "АКБ 2 заряд 85%"';
    }

    function stopListening() {
        isListening = false;
        const btn = document.getElementById('voiceBtn');
        const icon = document.getElementById('micIcon');
        const text = document.getElementById('micText');
        const status = document.getElementById('voiceStatus');
        
        btn.classList.remove('listening');
        icon.textContent = '🎤';
        text.textContent = 'Нажать и сказать';
        status.textContent = '';
    }

    function parseVoiceCommand(text) {
        stopListening();        
        // Извлечение заряда: "85%", "восемьдесят пять", "85 процентов"
        let charge = null;
        const percentMatch = text.match(/(\d{1,3})\s*%?/);
        if (percentMatch) {
            charge = parseInt(percentMatch[1]);
            if (charge > 100) charge = null;
        }
        
        // Русские цифры
        const numberWords = {
            'ноль':0,'один':1,'два':2,'три':3,'четыре':4,'пять':5,
            'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,
            'двадцать':20,'тридцать':30,'сорок':40,'пятьдесят':50,
            'шестьдесят':60,'семьдесят':70,'восемьдесят':80,'девяносто':90,'сто':100
        };
        
        for (const [word, num] of Object.entries(numberWords)) {
            if (text.includes(word) && charge === null) {
                charge = num;
                break;
            }
        }

        // Извлечение номера батареи
        let battery = null;
        for (const [alias, num] of Object.entries(batteryAliases)) {
            if (text.includes(alias)) { battery = num; break; }
        }
        if (!battery) {
            const battMatch = text.match(/акб\s*(\d)/i) || text.match(/батаре[ия]\s*(\d)/i);
            if (battMatch) battery = parseInt(battMatch[1]);
        }
        if (!battery) battery = 1; // По умолчанию

        // Извлечение даты
        let date = new Date().toISOString().split('T')[0];
        for (const [monthRu, monthIdx] of Object.entries(months)) {
            if (text.includes(monthRu)) {
                const dayMatch = text.match(/(\d{1,2})\s*(?:число)?/);
                if (dayMatch) {
                    const day = parseInt(dayMatch[1]);
                    const year = new Date().getFullYear();
                    const newDate = new Date(year, monthIdx, day);
                    if (!isNaN(newDate)) date = newDate.toISOString().split('T')[0];
                }
                break;
            }
        }
        // Валидация
        if (charge === null || isNaN(charge)) {
            showToast('⚠️ Не распознан заряд');
            return;
        }

        // Добавление записи
        entries.push({ id: Date.now() + Math.random(), date, battery, charge });
        saveData();
        showToast(`🎤 АКБ ${battery}: ${charge}%`);
    }


    // ============================================
    // 🚀 SPLASH SCREEN: Эффект проваливания
    // ============================================

    function createPortalParticles() {
        const container = document.getElementById('portalParticles');
        if (!container) return;
        container.innerHTML = '';
        const count = 30 + Math.floor(Math.random() * 20);
        
        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.className = 'portal-particle';
            const leftPos = 30 + Math.random() * 40;
            const delay = Math.random() * 0.5;
            const duration = 0.8 + Math.random() * 0.6;
            
            particle.style.left = `${leftPos}%`;
            particle.style.top = `${20 + Math.random() * 30}%`;
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;
            
            const colors = ['var(--accent-cyan)', 'var(--accent-purple)', '#ffffff', 'var(--accent-green)'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.background = color;
            particle.style.boxShadow = `0 0 10px ${color}`;
            
            container.appendChild(particle);
        }
    }

    function startSplashAnimation() {
        const splash = document.getElementById('splash-screen');
        if (!splash) { initApp(); return; }
        
        // Проверка prefers-reduced-motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {            splash.classList.add('hidden');
            initApp();
            return;
        }
        
        createPortalParticles();
        
        // Анимация "падения"
        setTimeout(() => { splash.classList.add('falling'); }, 1800);
        
        // Скрытие сплеша и инициализация приложения
        setTimeout(() => {
            splash.classList.add('hidden');
            initApp();
        }, 2500);
    }

    function initApp() {
        // Установка даты по умолчанию
        document.getElementById('dateInput').valueAsDate = new Date();
        
        // Загрузка данных
        try {
            const storedData = localStorage.getItem('batteryEntriesPro');
            if (storedData) {
                const parsed = JSON.parse(storedData);
                if (Array.isArray(parsed)) entries = parsed;
            }
        } catch (e) { console.error('Ошибка загрузки данных:', e); }
        
        // Рендер списка
        render();
    }

    // Запуск при загрузке
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startSplashAnimation);
    } else {
        startSplashAnimation();
    }

    // Обработчик клавиши Enter в поле заряда
    document.getElementById('chargeInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') manualAddEntry();
    });
</script>
