<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battery Tracker Pro</title>
    <meta name="theme-color" content="#050505">
    
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #020204;       
            --card-bg: rgba(10, 15, 30, 0.65); 
            --text-main: #e2e8f0;     
            --text-sec: #94a3b8;      
            --accent-cyan: #06b6d4;   /* Неоновый голубой */
            --accent-purple: #8b5cf6; /* Неоновый фиолетовый */
            --accent-green: #10b981;  
            --danger: #ef4444;        
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden; 
        }

        /* --- ФОНОВАЯ АНИМАЦИЯ (CANVAS) --- */
        #battery-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            /* Глубокий космический градиент */
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 40%, #000000 100%);        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto;
            position: relative;
            z-index: 1; 
        }

        h1 { 
            font-size: 24px; 
            font-weight: 800; 
            margin: 0 0 5px 0; 
            text-align: center; 
            letter-spacing: -0.5px;
            color: white;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.6); /* Фиолетовое свечение */
        }
        .subtitle { 
            text-align: center; 
            color: var(--text-sec); 
            font-size: 14px; 
            margin-bottom: 25px; 
        }

        /* Карточка ввода - Glassmorphism */
        .input-group {
            background: var(--card-bg);
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-purple);
            border-top: var(--glass-border);
            border-right: var(--glass-border);
            border-bottom: var(--glass-border);
        }

        /* Кнопка микрофона */
        .btn-voice { 
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white; 
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        
        .btn-voice:active { transform: scale(0.98); }
        
        .listening { 
            animation: pulse-red 1.5s infinite; 
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-text { 
            text-align: center; 
            font-size: 13px; 
            height: 20px; 
            margin-bottom: 15px; 
            color: var(--text-sec); 
            font-style: italic;
        }

        /* Селектор батарей */
        .battery-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .batt-checkbox { display: none; }

        .batt-label {
            padding: 10px 5px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid #334155;            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            color: var(--text-sec);
            user-select: none;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .batt-checkbox:checked + .batt-label {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            color: #ddd6fe;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .batt-label::before {
            content: "🔋";
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        /* Поля ввода */
        .row { display: flex; gap: 12px; margin-bottom: 20px; }
        
        input[type="date"], input[type="number"] {
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 16px;
            width: 100%;
            outline: none;
            background: rgba(2, 6, 23, 0.6);
            color: var(--text-main);
            font-family: inherit;
            transition: border-color 0.2s;
            backdrop-filter: blur(5px);
        }
        
        input:focus { border-color: #8b5cf6; background: rgba(2, 6, 23, 0.9); }

        /* Основные кнопки действий */
        button.btn-add { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;             border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        
        .actions-row { display: flex; gap: 10px; }
        
        .btn-secondary {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            background: rgba(15, 23, 42, 0.4);
            color: var(--text-main);
            backdrop-filter: blur(5px);
        }
        
        .btn-export:hover { background: rgba(30, 41, 59, 0.8); }
        .btn-clear { background: rgba(127, 29, 29, 0.4); color: #fecaca; }
        .btn-clear:hover { background: rgba(153, 27, 27, 0.6); }

        /* Список истории */
        .list-container { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            border-radius: var(--radius); 
            overflow: hidden; 
            box-shadow: var(--shadow); 
            border-left: 3px solid var(--accent-purple);
            border-top: var(--glass-border);
            border-right: var(--glass-border);
            border-bottom: var(--glass-border);
        }
        
        .list-header { 
            padding: 15px 20px; 
            background: rgba(2, 6, 23, 0.8); 
            border-bottom: 1px solid #1e293b; 
            font-weight: 700; 
            font-size: 14px;             color: var(--text-sec); 
            display: flex; 
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .list-item {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
            
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .list-item:last-child { border-bottom: none; }
        
        .item-info { flex: 1; }
        .item-date { font-weight: 600; font-size: 15px; color: var(--text-main); }
        
        .item-meta { 
            margin-top: 4px; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        
        .badge { 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 700; 
        }
        .badge-batt { 
            background: rgba(139, 92, 246, 0.2); 
            color: #c4b5fd; 
            border: 1px solid rgba(139, 92, 246, 0.3);
        }        .badge-cycle { 
            background: rgba(6, 182, 212, 0.2); 
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        
        .item-charge { 
            font-weight: 800; 
            color: #34d399; 
            font-size: 20px; 
            min-width: 60px; 
            text-align: right; 
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        .btn-delete { 
            background: transparent;
            color: #475569;
            border: none;
            font-size: 18px;
            padding: 5px;
            width: auto;
            margin: 0;
        }
        .btn-delete:hover { color: var(--danger); }

        /* Toast уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
        .toast.show {             opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0); 
        }
    </style>
</head>

<!-- Канвас для анимации -->
<canvas id="battery-canvas"></canvas>

<div class="container">
    <h1>🔋 Battery Tracker</h1>
    <div class="subtitle">Учёт заряда аккумуляторов</div>

    <div class="input-group">
        <!-- Голосовой ввод -->
        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()">
            <span id="micIcon">🎤</span> <span id="micText">Нажать и сказать</span>
        </button>
        <div class="status-text" id="voiceStatus"></div>

        <!-- Выбор АКБ -->
        <div class="battery-selector">
            <input type="checkbox" id="chk1" class="batt-checkbox" value="1" checked>
            <label for="chk1" class="batt-label">АКБ 1</label>

            <input type="checkbox" id="chk2" class="batt-checkbox" value="2">
            <label for="chk2" class="batt-label">АКБ 2</label>

            <input type="checkbox" id="chk3" class="batt-checkbox" value="3">
            <label for="chk3" class="batt-label">АКБ 3</label>

            <input type="checkbox" id="chk4" class="batt-checkbox" value="4">
            <label for="chk4" class="batt-label">АКБ 4</label>
        </div>

        <!-- Поля даты и заряда -->
        <div class="row">
            <input type="date" id="dateInput">
            <input type="number" id="chargeInput" placeholder="Заряд %" min="0" max="100">
        </div>

        <button class="btn-add" onclick="manualAddEntry()">
            Добавить запись
        </button>
        
        <div class="actions-row">
            <button class="btn-secondary btn-export" onclick="exportCSV()">📥 CSV</button>
            <button class="btn-secondary btn-clear" onclick="clearAll()">Очистить всё</button>        </div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>История</span>
            <span>Всего: <span id="totalCount">0</span></span>
        </div>
        <div id="listBody"></div>
    </div>
</div>

<div id="toast" class="toast">✅ Успешно добавлено</div>

<script>
    // --- АНИМАЦИЯ: КОСМИЧЕСКОЕ ЯДРО (MILKY WAY) ---
    const canvas = document.getElementById('battery-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    
    // Настройки галактики
    const config = {
        particleCount: 200,     // Много звезд для плотности
        rotationSpeed: 0.002,   // Скорость вращения галактики
        trailOpacity: 0.1       // Длина хвостов (меньше = длиннее)
    };

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Класс Звезды/Частицы
    class Star {
        constructor() {
            this.reset(true);
        }

        reset(initial = false) {
            // Распределяем частицы в виде спирали/диска
            // Радиус от центра
            this.radius = Math.random() * (Math.max(width, height) / 1.5);
            
            // Угол
            this.angle = Math.random() * Math.PI * 2;
                        // Скорость вращения зависит от расстояния (ближе к центру - быстрее)
            // Добавляем немного случайности для реалистичности
            this.speed = (config.rotationSpeed * (1000 / (this.radius + 100))) * (0.8 + Math.random() * 0.4);
            
            // Размер зависит от близости к центру (в центре ярче и крупнее)
            const centerFactor = 1 - (this.radius / (Math.max(width, height) / 1.5));
            this.size = Math.random() * (1 + centerFactor * 2);
            
            // Цвет: в центре белые/желтые, на краях синие/фиолетовые
            if (centerFactor > 0.7) {
                this.color = `rgba(255, 255, 255, ${0.5 + Math.random() * 0.5})`; // Белый центр
            } else if (centerFactor > 0.3) {
                this.color = `rgba(139, 92, 246, ${0.4 + Math.random() * 0.4})`; // Фиолетовый средний
            } else {
                this.color = `rgba(6, 182, 212, ${0.2 + Math.random() * 0.3})`; // Голубой край
            }
        }

        update() {
            // Вращаем частицу
            this.angle += this.speed;
        }

        draw() {
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Переводим полярные координаты в декартовы
            const x = centerX + Math.cos(this.angle) * this.radius;
            const y = centerY + Math.sin(this.angle) * this.radius;

            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            
            // Добавляем свечение только для крупных центральных звезд
            if (this.size > 1.5) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.fill();
        }
    }

    // Создаем массив звезд
    for(let i = 0; i < config.particleCount; i++) {
        particles.push(new Star());    }

    // Главный цикл анимации
    function animate() {
        // Эффект шлейфа без мигания
        ctx.fillStyle = `rgba(2, 2, 4, ${config.trailOpacity})`;
        ctx.fillRect(0, 0, width, height);
        
        // Рисуем звезды
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        requestAnimationFrame(animate);
    }
    animate();


    // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
    document.getElementById('dateInput').valueAsDate = new Date();
    
    let entries = [];
    try {
        const storedData = localStorage.getItem('batteryEntriesPro');
        if (storedData) {
            const parsed = JSON.parse(storedData);
            if (Array.isArray(parsed)) entries = parsed;
        }
    } catch (e) { console.error(e); }

    const months = {
        'января': 0, 'февраля': 1, 'марта': 2, 'апреля': 3, 'мая': 4, 'июня': 5,
        'июля': 6, 'августа': 7, 'сентября': 8, 'октября': 9, 'ноября': 10, 'декабря': 11
    };
    
    const batteryAliases = {
        'первый': 1, 'первую': 1, 'один': 1, 'единицу': 1, 'первое': 1,
        'второй': 2, 'вторую': 2, 'два': 2, 'двойку': 2, 'второе': 2,
        'третий': 3, 'тройку': 3, 'три': 3, 'третье': 3,
        'четвертый': 4, 'четверку': 4, 'четыре': 4, 'четвёртую': 4
    };

    function render() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById('totalCount').innerText = entries.length;
        let cycleCounters = {};
        entries.forEach(e => {
            const battKey = String(e.battery);
            cycleCounters[battKey] = (cycleCounters[battKey] || 0) + 1;
        });

        entries.forEach((entry, index) => {
            const battKey = String(entry.battery);
            const currentCycle = cycleCounters[battKey];
            cycleCounters[battKey]--; 

            const div = document.createElement('div');
            div.className = 'list-item';
            div.style.animationDelay = `${index * 0.05}s`; 
            
            const dateObj = new Date(entry.date);
            const dateStr = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            div.innerHTML = `
                <div class="item-info">
                    <div class="item-date">${dateStr}</div>
                    <div class="item-meta">
                        <span class="badge badge-batt">АКБ ${entry.battery}</span>
                        <span class="badge badge-cycle">Цикл ${currentCycle}</span>
                    </div>
                </div>
                <div class="item-charge">${entry.charge}%</div>
                <button class="btn-delete" onclick="deleteEntry(${entry.id})">✕</button>
            `;
            listBody.appendChild(div);
        });
    }

    function saveData() {
        localStorage.setItem('batteryEntriesPro', JSON.stringify(entries));
        render();
    }

    function getSelectedBatteries() {
        const checkboxes = document.querySelectorAll('.batt-checkbox:checked');
        return Array.from(checkboxes).map(cb => cb.value);
    }

        if (selectedBatts.length === 0) { showToast('⚠️ Выберите аккумулятор'); return; }
        const charge = parseInt(chargeVal);

<body>

<!-- Канвас для анимации -->
<canvas id="battery-canvas"></canvas>

<div class="container">
    <h1>🔋 Battery Tracker</h1>    <div class="subtitle">Учёт заряда аккумуляторов</div>

    <div class="input-group">
        <!-- Голосовой ввод -->
        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()">
            <span id="micIcon">🎤</span> <span id="micText">Нажать и сказать</span>
        </button>
        <div class="status-text" id="voiceStatus"></div>

        <!-- Выбор АКБ -->
        <div class="battery-selector">
            <input type="checkbox" id="chk1" class="batt-checkbox" value="1" checked>
            <label for="chk1" class="batt-label">АКБ 1</label>

            <input type="checkbox" id="chk2" class="batt-checkbox" value="2">
            <label for="chk2" class="batt-label">АКБ 2</label>

            <input type="checkbox" id="chk3" class="batt-checkbox" value="3">
            <label for="chk3" class="batt-label">АКБ 3</label>

            <input type="checkbox" id="chk4" class="batt-checkbox" value="4">
            <label for="chk4" class="batt-label">АКБ 4</label>
        </div>

        <!-- Поля даты и заряда -->
        <div class="row">
            <input type="date" id="dateInput">
            <input type="number" id="chargeInput" placeholder="Заряд %" min="0" max="100">
        </div>

        <button class="btn-add" onclick="manualAddEntry()">
            Добавить запись
        </button>
        
        <div class="actions-row">
            <button class="btn-secondary btn-export" onclick="exportCSV()">📥 CSV</button>
            <button class="btn-secondary btn-clear" onclick="clearAll()">Очистить всё</button>        </div>
    </div>

    <!-- БЛОК СТАТИСТИКИ -->
    <div class="stats-grid" id="statsContainer">
        <!-- Заполняется через JS -->
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>История</span>
            <span>Всего: <span id="totalCount">0</span></span>
        </div>
        <div id="listBody"></div>    </div>
</div>

<div id="toast" class="toast">✅ Успешно добавлено</div>

<script>
    // --- АНИМАЦИЯ: КОСМИЧЕСКОЕ ЯДРО (MILKY WAY) ---
    const canvas = document.getElementById('battery-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    
    // Настройки галактики
    const config = {
        particleCount: 200,     
        rotationSpeed: 0.002,   
        trailOpacity: 0.1       
    };

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Класс Звезды/Частицы
    class Star {
        constructor() {
            this.reset(true);
        }

        reset(initial = false) {
            this.radius = Math.random() * (Math.max(width, height) / 1.5);
            this.angle = Math.random() * Math.PI * 2;
            this.speed = (config.rotationSpeed * (1000 / (this.radius + 100))) * (0.8 + Math.random() * 0.4);
            
            const centerFactor = 1 - (this.radius / (Math.max(width, height) / 1.5));
            this.size = Math.random() * (1 + centerFactor * 2);
            
            if (centerFactor > 0.7) {
                this.color = `rgba(255, 255, 255, ${0.5 + Math.random() * 0.5})`; 
            } else if (centerFactor > 0.3) {
                this.color = `rgba(139, 92, 246, ${0.4 + Math.random() * 0.4})`; 
            } else {
                this.color = `rgba(6, 182, 212, ${0.2 + Math.random() * 0.3})`; 
            }
        }
        update() {
            this.angle += this.speed;
        }

        draw() {
            const centerX = width / 2;
            const centerY = height / 2;
            const x = centerX + Math.cos(this.angle) * this.radius;
            const y = centerY + Math.sin(this.angle) * this.radius;

            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            
            if (this.size > 1.5) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        }
    }

    for(let i = 0; i < config.particleCount; i++) {
        particles.push(new Star());    }

    function animate() {
        ctx.fillStyle = `rgba(2, 2, 4, ${config.trailOpacity})`;
        ctx.fillRect(0, 0, width, height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();


    // --- ЛОГИКА ПРИЛОЖЕНИЯ ---
    document.getElementById('dateInput').valueAsDate = new Date();
    
    let entries = [];
    try {
        const storedData = localStorage.getItem('batteryEntriesPro');
        if (storedData) {
            const parsed = JSON.parse(storedData);
            if (Array.isArray(parsed)) entries = parsed;
        }
    } catch (e) { console.error(e); }
    const months = {
        'января': 0, 'февраля': 1, 'марта': 2, 'апреля': 3, 'мая': 4, 'июня': 5,
        'июля': 6, 'августа': 7, 'сентября': 8, 'октября': 9, 'ноября': 10, 'декабря': 11
    };
    
    const batteryAliases = {
        'первый': 1, 'первую': 1, 'один': 1, 'единицу': 1, 'первое': 1,
        'второй': 2, 'вторую': 2, 'два': 2, 'двойку': 2, 'второе': 2,
        'третий': 3, 'тройку': 3, 'три': 3, 'третье': 3,
        'четвертый': 4, 'четверку': 4, 'четыре': 4, 'четвёртую': 4
    };

    // Вспомогательная функция для склонения слова "цикл"
    function declensionOfCycle(number, titles) {
        const cases = [2, 0, 1, 1, 1, 2];
        return titles[
            (number % 100 > 4 && number % 100 < 20) ? 2 : cases[(number % 10 < 5) ? number % 10 : 5]
        ];
    }

    function render() {
        const listBody = document.getElementById('listBody');
        listBody.innerHTML = '';
        
        // Сортировка записей (новые сверху)
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById('totalCount').innerText = entries.length;

        // 1. РАСЧЕТ СТАТИСТИКИ
        const statsData = {};
        // Инициализация данных для 4 АКБ
        for(let i=1; i<=4; i++) {
            statsData[i] = { count: 0, lastCharge: '-', lastDate: null };
        }

        // Считаем данные
        entries.forEach(e => {
            const id = parseInt(e.battery);
            if(statsData[id]) {
                statsData[id].count++;
                // Сохраняем заряд последнего по времени замера
                if (!statsData[id].lastDate || new Date(e.date) > new Date(statsData[id].lastDate)) {
                    statsData[id].lastDate = e.date;
                    statsData[id].lastCharge = e.charge;
                }
            }
        });

        // Отрисовка карточек статистики        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = '';
        
        for(let i=1; i<=4; i++) {
            const data = statsData[i];
            const dateStr = data.lastDate ? new Date(data.lastDate).toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) : '—';
            
            // Формируем текст с правильным склонением
            let cycleText = '';
            if (data.count === 0) {
                cycleText = 'Нет данных';
            } else {
                cycleText = `${data.count} ${declensionOfCycle(data.count, ['цикл', 'цикла', 'циклов'])}`;
            }

            const card = document.createElement('div');
            card.className = `stat-card ${data.count === 0 ? 'empty' : ''}`;
            card.innerHTML = `
                <div class="stat-header">
                    <span>АКБ ${i}</span>
                </div>
                <div class="stat-value">${cycleText}</div>
                <div class="stat-sub">
